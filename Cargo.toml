[package]
name = "photo_organizer"
version = "0.1.0"
edition = "2021"

[dependencies]
kamadak-exif = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3.0"
filetime = "0.2"
walkdir = "2.4"
